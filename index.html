<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskPetal — Small steps, bigger dreams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E🌸%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="petals" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="36" height="36">
              <circle cx="24" cy="24" r="22" fill="#2a2233" />
              <path
                fill="#f3afcb"
                d="M24 14c2.4 3.2 2.8 7 1.2 10.2-3-1-5.4-3.4-6.6-6.6C21 16.2 22.6 14.6 24 14zm0 0c-2.4 3.2-2.8 7-1.2 10.2 3-1 5.4-3.4 6.6-6.6C27 16.2 25.4 14.6 24 14zm8.6 8.6c-3.2 2.4-7 2.8-10.2 1.2 1 3 3.4 5.4 6.6 6.6 1.4-2.4 3-4 3.6-7.8zm-17.2 0c3.2 2.4 7 2.8 10.2 1.2-1 3-3.4 5.4-6.6 6.6-1.4-2.4-3-4-3.6-7.8zM24 34c-2.4-3.2-2.8-7-1.2-10.2 3 1 5.4 3.4 6.6 6.6C27 31.8 25.4 33.4 24 34zm0 0c2.4-3.2 2.8-7 1.2-10.2-3 1-5.4 3.4-6.6 6.6C21 31.8 22.6 33.4 24 34z"
              />
              <circle cx="24" cy="24" r="3.2" fill="#fff4e8" />
            </svg>
          </div>
          <div>
            <h1>TaskPetal</h1>
            <p>Small steps, bigger dreams ♥</p>
          </div>
        </div>
        <nav class="nav" aria-label="Primary">
          <button class="nav-item is-active" data-nav="home" type="button">
            <span class="nav-icon">⌂</span>
            Home
          </button>
          <button class="nav-item" data-nav="all" type="button">
            <span class="nav-icon">☰</span>
            All Tasks
            <span class="nav-count" data-count="total">0</span>
          </button>
          <button class="nav-item" data-nav="pending" type="button">
            <span class="nav-icon">○</span>
            Pending
            <span class="nav-count" data-count="pending">0</span>
          </button>
          <button class="nav-item" data-nav="completed" type="button">
            <span class="nav-icon">✓</span>
            Completed
            <span class="nav-count" data-count="completed">0</span>
          </button>
        </nav>
        <div class="sidebar-section">
          <div class="section-head">
            <span>Categories</span>
            <button
              class="icon-btn"
              id="add-category-sidebar"
              type="button"
              title="Add category"
            >
              +
            </button>
          </div>
          <ul class="category-list" id="sidebar-categories"></ul>
        </div>
        <div class="sidebar-footer">
          <p class="pep-talk">You’re doing<br />amazing! ♥</p>
          <svg class="branch" viewBox="0 0 180 140" aria-hidden="true">
            <path
              d="M10 130 C40 110, 50 70, 90 60 C120 52, 140 20, 170 10"
              fill="none"
              stroke="#3a3148"
              stroke-width="3"
            />
            <g fill="#f3afcb">
              <ellipse
                cx="62"
                cy="86"
                rx="8"
                ry="5"
                transform="rotate(-30 62 86)"
              />
              <ellipse
                cx="88"
                cy="58"
                rx="9"
                ry="5"
                transform="rotate(20 88 58)"
              />
              <ellipse
                cx="118"
                cy="48"
                rx="8"
                ry="5"
                transform="rotate(-10 118 48)"
              />
              <ellipse
                cx="148"
                cy="22"
                rx="9"
                ry="5"
                transform="rotate(25 148 22)"
              />
            </g>
          </svg>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="greeting">
              Good morning, Dreamer <span aria-hidden="true">🌸</span>
            </h2>
            <p class="subtitle">Plan your day, one petal at a time.</p>
          </div>
          <div class="topbar-actions">
            <div class="date-chip">
              <span aria-hidden="true">📅</span>
              <time id="today-date"></time>
            </div>
            <button
              class="theme-toggle"
              id="theme-toggle"
              type="button"
              aria-label="Toggle theme"
            >
              <span class="moon">☾</span>
            </button>
          </div>
        </header>
        <section class="stats" aria-label="Progress">
          <article class="stat-card">
            <div class="stat-icon list">☰</div>
            <div>
              <strong data-stat="total">0</strong>
              <span>Total Tasks</span>
            </div>
          </article>
          <article class="stat-card">
            <div class="stat-icon done">✓</div>
            <div>
              <strong data-stat="completed">0</strong>
              <span>Completed</span>
            </div>
          </article>
          <article class="stat-card">
            <div class="stat-icon remain">◷</div>
            <div>
              <strong data-stat="pending">0</strong>
              <span>Remaining</span>
            </div>
          </article>
          <article class="stat-card progress-card">
            <div class="progress-label">
              <span>Overall Progress</span>
              <strong data-stat="percent">0%</strong>
            </div>
            <div
              class="progress-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="progress-fill"></div>
            </div>
          </article>
        </section>
        <section class="composer">
          <h3><span aria-hidden="true">🌸</span> Add a new task</h3>
          <form id="task-form">
            <label class="sr-only" for="task-title">Task title</label>
            <input
              id="task-title"
              name="title"
              type="text"
              placeholder="What do you need to do?"
              maxlength="120"
              required
              autocomplete="off"
            />
            <label class="sr-only" for="task-category">Category</label>
            <div class="select-wrap">
              <span class="dot" id="category-dot"></span>
              <select id="task-category" name="category"></select>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
